services:
  gameshelf:
    # Docker Hub 公开固定版本镜像；仍保留源码构建入口。
    image: jyh9521/gameshelf:0.1.2
    build: .
    ports:
      - "${GAMESHELF_PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/data/gameshelf.db
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      SECURE_COOKIE: "${SECURE_COOKIE:-false}"
      APP_URL: "${APP_URL:-}"
    volumes:
      - "${GAMESHELF_DATA_DIR:-./.data/docker}:/data"
    restart: unless-stopped
    stop_grace_period: 30s


