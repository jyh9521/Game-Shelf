services:
  gameshelf:
    # Docker Hub 公开固定版本镜像；仍保留源码构建入口。
    image: "${GAMESHELF_IMAGE:-jyh9521/gameshelf:0.1.10}"
    build: .
    ports:
      - "${GAMESHELF_PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/data/gameshelf.db
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      SECURE_COOKIE: "${SECURE_COOKIE:-false}"
      APP_URL: "${APP_URL:-}"
      IGDB_CLIENT_ID: "${IGDB_CLIENT_ID:-}"
      IGDB_CLIENT_SECRET: "${IGDB_CLIENT_SECRET:-}"
      RAWG_API_KEY: "${RAWG_API_KEY:-}"
      THEGAMESDB_API_KEY: "${THEGAMESDB_API_KEY:-}"
      SCREENSCRAPER_DEV_ID: "${SCREENSCRAPER_DEV_ID:-}"
      SCREENSCRAPER_DEV_PASSWORD: "${SCREENSCRAPER_DEV_PASSWORD:-}"
      SCREENSCRAPER_USERNAME: "${SCREENSCRAPER_USERNAME:-}"
      SCREENSCRAPER_PASSWORD: "${SCREENSCRAPER_PASSWORD:-}"
      SCREENSCRAPER_SOFTNAME: "${SCREENSCRAPER_SOFTNAME:-GameShelf}"
      STEAMGRIDDB_API_KEY: "${STEAMGRIDDB_API_KEY:-}"
      STEAM_WEB_API_KEY: "${STEAM_WEB_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
    volumes:
      - "${GAMESHELF_DATA_DIR:-./.data/docker}:/data"
    restart: unless-stopped
    stop_grace_period: 30s


